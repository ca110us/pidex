name: Orthopedics department
industry: healthcare
language: en
description: Patient photos in an orthopedics or trauma department, identified by hospital wristband.
strictness: strict
privacy: high
date_order: mdy
subject_types:
  - key: patient
    name: Patient
    carriers: >-
      Hospital wristband (usually a barcode plus printed name, date of birth and
      MRN), bed card, or a printed chart label sticker.
    identity_fields:
      - { key: name, name: Name, kind: person_name }
      - { key: dob, name: Date of birth, kind: date }
      - { key: mrn, name: MRN, kind: id, description: Medical record number, pattern: "^[A-Z0-9]{5,12}$" }
    display_fields: [name, dob]
    match:
      # Two identifiers, as required for positive patient identification.
      min_fields: 2
    barcode:
      field: mrn
      pattern: "^(?:MRN[:\\s-]*)?([A-Z0-9]{5,12})$"
      # A wristband barcode scan is an accepted positive identification.
      strong: true
tags:
  - { key: side_left, name: Left, group: side }
  - { key: side_right, name: Right, group: side }
  - { key: ankle, name: Ankle, group: site }
  - { key: foot, name: Foot, group: site }
  - { key: knee, name: Knee, group: site }
  - { key: hip, name: Hip, group: site }
