  - { key: hand, name: Hand, group: site }
  - { key: elbow, name: Elbow, group: site }
  - { key: shoulder, name: Shoulder, group: site }
  - { key: spine, name: Spine or back, group: site }
  - { key: swelling, name: Swelling, group: finding }
  - { key: bruising, name: Bruising, group: finding }
  - { key: abrasion, name: Abrasion, group: finding }
  - { key: laceration, name: Laceration, group: finding }
  - { key: deformity, name: Visible deformity, group: finding }
  - { key: surgical_wound, name: Surgical wound, group: finding }
  - { key: sutures_staples, name: Sutures or staples, group: finding }
  - { key: drainage, name: Drainage or exudate, group: finding }
  - { key: cast_splint, name: Cast or splint, group: treatment }
  - { key: external_fixator, name: External fixator, group: treatment }
  - { key: dressing, name: Dressing, group: treatment }
  - { key: imaging_screen, name: Photo of an imaging screen, group: media, description: "A photo of an X-ray, CT or MRI shown on a monitor or film" }
