version: "2"
sql:
  - engine: postgresql
    schema: internal/store/migrations
    queries: internal/store/queries
    gen:
      go:
        package: dbq
        out: internal/store/dbq
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: vector
            go_type: github.com/pgvector/pgvector-go.Vector
          - db_type: vector
            nullable: true
            go_type:
              import: github.com/pgvector/pgvector-go
              type: Vector
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: float64
