name: pidex

services:
  postgres:
    build: ./deploy/postgres
    image: pidex-postgres:17
    environment:
      POSTGRES_USER: pidex
      POSTGRES_PASSWORD: pidex
      POSTGRES_DB: pidex
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pidex"]
      interval: 2s
      timeout: 3s
      retries: 30

  # What a subject looks like, as a vector (vision/README.md).
  vision:
    build: ./vision
    image: pidex-vision:1
    environment:
      LOOK_MODEL: dinov2_b
    ports:
      - "8090:8090"
    volumes:
      - vision-models:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')\""]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  postgres-data:
  vision-models:
