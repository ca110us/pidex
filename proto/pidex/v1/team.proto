syntax = "proto3";

package pidex.v1;

import "pidex/v1/common.proto";

option go_package = "pidex/gen/pidex/v1;pidexv1";

// TeamService manages workspaces. Each team has its own config, subjects and
// photos; a token belongs to exactly one team.
service TeamService {
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse);
  // CreateTeam makes the caller the owner of a new team with the given
  // config as version 1, and returns a token for it.
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);
  // GetOverview is what a collection card and its header show: counts,
  // the latest photos for a cover, and the tags most used.
  rpc GetOverview(GetOverviewRequest) returns (GetOverviewResponse);
  // Deletes the team for good: every photo and its file, subject,
  // conversation, version and token. Only its owner may, naming it to
  // confirm. Nothing can be recovered.
  rpc DeleteTeam(DeleteTeamRequest) returns (DeleteTeamResponse);
}

message Team {
  string id = 1;
  string name = 2;
  // The caller's role in this team: owner, admin, member or viewer.
  string role = 3;
  int32 config_version = 4;
}

message GetTeamRequest {}

message GetTeamResponse {
  Team team = 1;
}

message CreateTeamRequest {
  string name = 1;
  string config_json = 2;
}

message CreateTeamResponse {
  Team team = 1;
  // Shown once; only its hash is stored.
  string token = 2;
}

message GetOverviewRequest {
  // How many of the latest photos to return; 0 means 4.
  int32 recent_count = 1;
}

message GetOverviewResponse {
  Team team = 1;
  // Photos that are not junk.
  int32 photo_count = 2;
  int32 subject_count = 3;
  // Newest first.
  repeated Photo recent = 4;
  // Most used first.
  repeated TagCount tags = 5;
}

message DeleteTeamRequest {
  // The team's name exactly, so a wrong token cannot delete another team.
  string confirm_name = 1;
}

message DeleteTeamResponse {
  int32 deleted_photos = 1;
}
