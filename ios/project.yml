name: Pidex
options:
  bundleIdPrefix: app.pidex
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Localizable strings live in String Catalogs, extracted by the compiler.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  # Pinned to the buf plugin versions in ../buf.gen.yaml. Bump together.
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    exactVersion: 1.38.1
  Connect:
    url: https://github.com/connectrpc/connect-swift
    exactVersion: 1.2.2
  # The phone's copy of each collection (Library/LocalLibrary.swift).
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1
targets:
  Pidex:
    type: application
    platform: iOS
    sources:
      - path: Pidex
    dependencies:
      - package: SwiftProtobuf
      - package: Connect
      - package: GRDB
    info:
      path: Pidex/Resources/Info.plist
      properties:
        CFBundleDisplayName: Pidex
        CFBundleName: Pidex
        # The P on the system background, ink or paper with the appearance.
        UILaunchScreen:
          UIImageName: LaunchMark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # A camera app stays upright; iPad then needs full screen.
        UIRequiresFullScreen: true
        NSCameraUsageDescription: Pidex uses the camera to take work photos and to read the labels, numbers and barcodes that identify what you photograph.
        NSPhotoLibraryAddUsageDescription: Pidex saves the photos you choose to your photo library. It never reads your library.
        NSLocationWhenInUseUsageDescription: Pidex notes where each photo is taken, so you can find and group photos by place, such as everything from a trip.
        NSLocalNetworkUsageDescription: Pidex connects to your team's server on the local network during development.
        NSMicrophoneUsageDescription: Pidex listens while you dictate a scenario description.
        NSSpeechRecognitionUsageDescription: Pidex turns what you say into text for the scenario description.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    # Team and bundle identifier come from Signing.xcconfig and your own
    # Local.xcconfig.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(PIDEX_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # Rendered from design/brand by design/brand/render.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ink, not system blue: black in light mode, white in dark (App/Theme.swift).
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  PidexTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PidexTests
    dependencies:
      - target: Pidex
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pidex.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Pidex
  PidexUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PidexUITests
    dependencies:
      - target: Pidex
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Pidex
schemes:
  Pidex:
    build:
      targets:
        Pidex: all
        PidexTests: [test]
        PidexUITests: [test]
    test:
      targets:
        - PidexTests
        - PidexUITests
